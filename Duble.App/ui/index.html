<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duble</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="brand" id="brand"></div>
    <div class="project" id="titlebar-project" hidden></div>
    <div class="spacer"></div>
    <div class="win">
      <button id="win-min" data-i18n-title="win.minimize"></button>
      <button id="win-max" data-i18n-title="win.maximize"></button>
      <button id="win-close" class="close" data-i18n-title="win.close"></button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Duble"></nav>
  <main class="main" id="main"><div class="wrap" id="wrap"></div></main>
  <footer class="statusbar" id="status"></footer>
  <div id="warstwa-dialog"></div>
  <div id="warstwa-toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
