name: release

# Tag a commit to cut a release:
#   git tag -a v1.0.1 -m "Duble 1.0.1" && git push origin v1.0.1
# The workflow builds, runs the tests, compiles the Inno Setup installer (Duble-Setup.exe — the wizard in
# installer\Duble.iss, which the installed program also downloads to update itself), writes a SHA-256
# checksum and creates a GitHub Release with the matching section of CHANGELOG.md as the notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v), e.g. 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build + release (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive


      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # the interface is a React application; Duble.App builds it with Vite and embeds the result
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: Duble.App/web/package-lock.json

      - name: Install interface dependencies
        run: npm ci
        working-directory: Duble.App/web

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not X.Y.Z" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Duble $v"

      - name: Build
        run: dotnet build Duble.sln -c Release --nologo -p:Version=${{ steps.v.outputs.version }}

      - name: Test
        run: dotnet test Duble.Tests -c Release --no-build --nologo

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $notes = "notes.md"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { "See CHANGELOG.md." | Set-Content $notes -Encoding utf8; exit 0 }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end -gt 1) { $rest[0..($end - 2)] } elseif ($end) { @() } else { $rest }
          if (-not $body) { $body = @("See CHANGELOG.md.") }
          $body | Set-Content $notes -Encoding utf8

      # The installer: the application published as a plain folder, wrapped by Inno Setup into the wizard
      # installer\Duble.iss describes. The installed program updates itself by downloading the newest Setup
      # from the release assets and running it with /VERYSILENT.
      - name: Publish for the installer
        run: >
          dotnet publish Duble.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=false
          -p:DebugType=none -p:Version=${{ steps.v.outputs.version }} -o installer/publish --nologo

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} /DPublishDir=publish installer\Duble.iss

      - name: Checksum the installer
        shell: pwsh
        run: |
          $exe = 'installer/out/Duble-Setup.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Duble-Setup.exe" | Set-Content 'installer/out/Duble-Setup.exe.sha256' -Encoding ascii
          Write-Host "SHA-256 $hash  ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.v.outputs.version }}'
          gh release create "v$v" installer/out/Duble-Setup.exe installer/out/Duble-Setup.exe.sha256 `
            --title "Duble $v" --notes-file notes.md --target ${{ github.sha }}
