name: release

# Tag a commit to cut a release:
#   git tag -a v1.0.1 -m "Duble 1.0.1" && git push origin v1.0.1
# The workflow builds, runs the tests, publishes the portable single-file Duble.exe and the Velopack
# installer (Duble-win-Setup.exe — shortcuts, uninstall entry, and the packages the installed program
# updates itself from), writes SHA-256 checksums and creates a GitHub Release with the matching section
# of CHANGELOG.md as the notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v), e.g. 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build + release (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive


      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # the interface is a React application; Duble.App builds it with Vite and embeds the result
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: Duble.App/web/package-lock.json

      - name: Install interface dependencies
        run: npm ci
        working-directory: Duble.App/web

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not X.Y.Z" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Duble $v"

      - name: Build
        run: dotnet build Duble.sln -c Release --nologo -p:Version=${{ steps.v.outputs.version }}

      - name: Test
        run: dotnet test Duble.Tests -c Release --no-build --nologo

      - name: Publish single file
        run: dotnet publish Duble.App -p:PublishProfile=win-x64 --nologo -p:Version=${{ steps.v.outputs.version }}

      - name: Checksum
        shell: pwsh
        run: |
          $exe = 'publish/Duble.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Duble.exe" | Set-Content 'publish/Duble.exe.sha256' -Encoding ascii
          Write-Host "SHA-256 $hash  ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $notes = "publish/notes.md"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { "See CHANGELOG.md." | Set-Content $notes -Encoding utf8; exit 0 }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end -gt 1) { $rest[0..($end - 2)] } elseif ($end) { @() } else { $rest }
          if (-not $body) { $body = @("See CHANGELOG.md.") }
          $body | Set-Content $notes -Encoding utf8

      # The installer: the same application published as a folder — Velopack swaps files inside its install,
      # so it has no use for the single-file bundle — then packed with Update.exe and the shortcuts.
      - name: Publish for the installer
        run: >
          dotnet publish Duble.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=false
          -p:DebugType=none -p:Version=${{ steps.v.outputs.version }} -o velopack/publish --nologo

      - name: Install vpk
        run: dotnet tool install -g vpk

      # the previous release, so this one can ship a delta package; the first Velopack release has none
      - name: Download previous Velopack release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token $env:GH_TOKEN -o velopack/out
          if ($LASTEXITCODE -ne 0) { Write-Host "no previous Velopack release - shipping a full package only" }
          exit 0

      - name: Pack the installer
        run: >
          vpk pack --packId Duble --packVersion ${{ steps.v.outputs.version }} --packDir velopack/publish
          --mainExe Duble.exe --packTitle Duble --packAuthors Bobadu --icon Duble.App/assets/duble.ico
          --shortcuts Desktop,StartMenuRoot --noPortable --releaseNotes publish/notes.md -o velopack/out

      - name: Checksum the installer
        shell: pwsh
        run: |
          $exe = 'velopack/out/Duble-win-Setup.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Duble-win-Setup.exe" | Set-Content 'velopack/out/Duble-win-Setup.exe.sha256' -Encoding ascii
          Write-Host "SHA-256 $hash  ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.v.outputs.version }}'
          # the Setup and its checksum, the update packages, and the index the installed program reads;
          # assets.win.json is build metadata and stays out
          $velopack = Get-ChildItem velopack/out -File |
            Where-Object { $_.Name -match 'Setup\.exe(\.sha256)?$|\.nupkg$|^releases\.' } |
            ForEach-Object FullName
          gh release create "v$v" publish/Duble.exe publish/Duble.exe.sha256 @velopack `
            --title "Duble $v" --notes-file publish/notes.md --target ${{ github.sha }}
