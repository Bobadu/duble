name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + tests (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive


      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Publish single file
        shell: pwsh
        run: ./build.ps1 -Publish -BezTestow

      - name: Upload Duble.exe
        uses: actions/upload-artifact@v7
        with:
          name: Duble-exe-${{ github.sha }}
          path: publish/Duble.exe
          retention-days: 14
