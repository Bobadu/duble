name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    # every target branch, not only main: a refactor lands as a stack of pull requests, and a stacked one has
    # to be checkable before the one below it is merged
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + tests (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive


      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # the interface is a React application; Duble.App builds it with Vite and embeds the result
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: Duble.App/web/package-lock.json

      - name: Install interface dependencies
        run: npm ci
        working-directory: Duble.App/web

      - name: Check the interface types
        run: npm run typecheck
        working-directory: Duble.App/web

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Duble.sln -c Release --nologo

      - name: Test
        run: dotnet test Duble.Tests -c Release --no-build --nologo

      - name: Publish single file
        run: dotnet publish Duble.App -p:PublishProfile=win-x64 --nologo

      - name: Upload Duble.exe
        uses: actions/upload-artifact@v7
        with:
          name: Duble-exe-${{ github.sha }}
          path: publish/Duble.exe
          retention-days: 14
